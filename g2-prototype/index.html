<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>G2 Voice Search · 마이크 시험</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; margin: 20px; line-height: 1.5; }
    button { font-size: 16px; padding: 12px 16px; margin: 8px 8px 8px 0; border: 0; border-radius: 10px; }
    #microphone { background: #222; color: white; }
    #microphone:disabled { opacity: .45; }
    #status, #stats { overflow-wrap: anywhere; }
    .note { color: #555; }
  </style>
</head>
<body>
  <h2>G2 영한검색 · 마이크 연결 시험 v0.1.1</h2>
  <p id="status">G2 안경 연결 중…</p>
  <p id="stats">수신 패킷: 0 · 데이터: 0.0 KB</p>
  <button id="microphone" disabled>G2 마이크 12초 테스트 시작</button>
  <button id="show" disabled>렌즈 표시 다시 테스트</button>
  <p class="note">안경 마이크의 오디오 데이터가 앱으로 전달되는지 확인합니다. 음성은 저장하거나 서버에 전송하지 않습니다. 아직 영어 받아쓰기 및 한국어 문단 검색 기능은 없습니다.</p>
  <script type="module" src="/main.js"></script>
</body>
</html>
