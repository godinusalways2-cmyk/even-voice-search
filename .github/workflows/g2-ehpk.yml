name: G2 EHPK prototype
on:
  workflow_dispatch:
  push:
    paths:
      - 'g2-prototype/**'
      - '.github/workflows/g2-ehpk.yml'
jobs:
  package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: g2-prototype
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Prepare private mic-test manifest
        run: |
          npx evenhub init
          node prepare-manifest.mjs
      - name: Package G2 app
        run: npx evenhub pack app.json dist -o g2-voice-prototype.ehpk
      - uses: actions/upload-artifact@v4
        with:
          name: g2-voice-prototype
          path: g2-prototype/g2-voice-prototype.ehpk
          retention-days: 14
